[project]
name = "gm-ml"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "xgboost",
  "onnx",
  "onnxmltools",
  "skl2onnx",
  "jupyter",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
